<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Solo — Duolume lab</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06080d;
        color: #eaf0f6;
        overflow: hidden;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .shelf {
        position: absolute;
        padding: 10px 14px;
        border: 1px solid rgba(190, 210, 235, 0.16);
        border-radius: 10px;
        background: rgba(12, 17, 25, 0.55);
        color: #a9b4c2;
        font-size: 12px;
        pointer-events: none;
      }
      .shelf-a {
        right: 9%;
        top: 58%;
        width: 260px;
      }
      .shelf-b {
        left: 30%;
        top: 34%;
        width: 200px;
      }
      #label {
        position: fixed;
        left: 12px;
        top: 10px;
        margin: 0;
        color: #a9b4c2;
        font-size: 12px;
        pointer-events: none;
      }
      #label a {
        color: inherit;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <p id="label"></p>
    <div class="shelf shelf-a" data-fx-anchor="shelf-a" data-fx-tags="ledge">a DOM element</div>
    <div class="shelf shelf-b" data-fx-anchor="shelf-b" data-fx-tags="ledge">another one</div>
    <script type="module" src="./solo.ts"></script>
  </body>
</html>
